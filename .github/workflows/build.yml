name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  workflow_dispatch:
    inputs:
      coverage-ref:
        description: "Exact commit SHA to measure for the initial coverage baseline"
        required: true
        type: string

permissions: read-all

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@496f38088eff1a37bae1b43d158146a8a9d83a37
    with:
      go-floor: "1.19"
      doc-coverage: true
      doc-coverage-file: docs/API.md
      doc-coverage-config: true
      cov-min: 94
      footprint: true
      footprint-max-mb: 3
    secrets: inherit

  # Backfill real coverage for a pre-OIDC commit; do not substitute head data.
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.coverage-ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.19.x"
      - run: go test -race -coverprofile=coverage-baseline.txt ./...
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage-baseline.txt
          disable_search: true
          fail_ci_if_error: true
          override_commit: ${{ inputs.coverage-ref }}
          override_branch: master
